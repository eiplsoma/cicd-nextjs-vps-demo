# Reference copy of the live nginx server block for this subdomain.
#
# This file is NOT deployed automatically by anything — it's not read by
# Docker, Compose, or the GitHub Actions workflow. It documents what
# actually lives at /etc/nginx/sites-available/cicd-demo.woollydesign.hu
# on the VPS, so the config is reproducible from git instead of only
# existing as a manual, undocumented change on the server (see
# docs/RUNBOOK.md step 4 and docs/adr/0005-nginx-instead-of-caddy.md).
#
# The `# managed by Certbot` lines were added automatically by
# `certbot --nginx` and must not be hand-edited — certbot rewrites them on
# renewal. The `add_header` lines are ours, added afterward for basic
# security headers (see docs/adr/0005-nginx-instead-of-caddy.md).
#
# If this file and the VPS ever drift apart, the VPS is the source of
# truth for what's actually running — update this copy to match it, not
# the other way around.
#
# `server_tokens off` is set here explicitly rather than relied on from
# this VPS's global nginx.conf, so this config stays correct on its own
# if it's ever copied to a different server.

server {
    server_name cicd-demo.woollydesign.hu;
    server_tokens off;

    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cicd-demo.woollydesign.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cicd-demo.woollydesign.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cicd-demo.woollydesign.hu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cicd-demo.woollydesign.hu;
    return 404; # managed by Certbot


}
