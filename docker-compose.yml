# Reference copy — editing this file has no effect on the running stack until
# it's copied to /opt/cicd-demo on the VPS (see docs/RUNBOOK.md).
services:
  app:
    image: ghcr.io/eiplsoma/cicd-nextjs-vps-demo:latest
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
